version: 2
updates:
  # Minor and patch updates only, grouped into one PR a week. Major upgrades
  # (React, Vite, Tailwind ...) need code changes and are done by hand.
  # Security updates still arrive for any version.
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  # Node stays on the LTS line in .nvmrc; Caddy updates within v2.
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
